/**:
    ros__parameters:
        image_transport: raw
        family: 36h11
        # Edge size of the BLACK square, in metres - not the white quiet zone, not the
        # printed card. Reported depth scales LINEARLY with this number, and nothing
        # about a wrong value looks wrong in the detection itself.
        #
        # Measured, not assumed. Against a synthetic frame drawing the marker at
        # exactly size*fx/depth pixels, size: 0.6 reproduced a known 3.000 m at
        # 3.002 m (1.001x) - so the value below is right for a tag whose black square
        # really is 0.6 m. The same 0.6 against the Gazebo fixture, whose detected
        # square turned out to be 0.296 m, reported a tag 2.03x too far away (4.78 m
        # for a true 2.36 m) and sent Nav2 to empty floor well beyond it.
        #
        # THE SIMULATOR AND THE PHYSICAL ARENA DO NOT USE THE SAME TAG, and picking
        # the wrong one is a silent 37% distance error.
        #
        # Simulation - 0.120 m, measured from the organisers' own generator:
        #   world_generator.py mounts a face of TAG_SIZE = 0.15 m, not 0.165, and its
        #   texture carries a white quiet zone, so the black square is 0.800 of that
        #   face - checked on tags 1, 4, 7 and 9, identical on all four.
        #   0.150 x 0.800 = 0.120 m
        #
        # Physical arena - 0.165 m. Photographs of the built arena show each tag
        # printed on a sheet and taped to a plywood board on a wooden post; the black
        # square spans roughly 76-80% of the sheet's width, which on A4 portrait
        # (210 mm) gives 160-168 mm. That agrees with the 16.5 cm the phase-reelle
        # guide quotes and rules out 0.120 for the real run.
        #
        # The value below is the PHYSICAL one, because the real run is the one that
        # scores. Simulation must pass tag_size:=0.12 explicitly - sim.sh does. The
        # launch file passes `size` AFTER this file, so its argument always wins:
        #   ros2 launch parc_solution apriltag_detection.launch.py tag_size:=0.12
        #
        # STILL WORTH MEASURING ON THE DAY: a photograph is not a tape measure, and
        # the print need not match the guide. Park at a known distance, run
        # outils/calibrate_tag_size.py - it goes through the real lens and the real
        # print - and pass whatever it reports.
        size: 0.165
        max_hamming: 0
        qos_profile: default

        detector:
            threads: 1
            # Default (2.0) halves the working resolution before quad detection.
            # Confirmed by direct test (test_assets/): our tag is already marginal at
            # ~12 px/module at a 2 m working distance: decimate=2.0 pushed detection to
            # zero. 1.0 costs more CPU per frame but is what actually finds the tag.
            decimate: 1.0
            blur: 0.0
            refine: True
            sharpening: 0.25
            debug: False

        pose_estimation_method: "pnp"
