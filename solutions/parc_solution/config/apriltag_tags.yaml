/**:
    ros__parameters:
        image_transport: raw
        family: 36h11
        # Edge size of the BLACK square, in metres - not the white quiet zone, not the
        # printed card. Reported depth scales LINEARLY with this number, and nothing
        # about a wrong value looks wrong in the detection itself.
        #
        # Measured, not assumed. Against a synthetic frame drawing the marker at
        # exactly size*fx/depth pixels, size: 0.6 reproduced a known 3.000 m at
        # 3.002 m (1.001x) - so the value below is right for a tag whose black square
        # really is 0.6 m. The same 0.6 against the Gazebo fixture, whose detected
        # square turned out to be 0.296 m, reported a tag 2.03x too far away (4.78 m
        # for a true 2.36 m) and sent Nav2 to empty floor well beyond it.
        #
        # 0.12 is MEASURED from the organisers' own arena generator, and it is NOT
        # the 0.165 the phase-réelle guide quotes. Two separate reductions get you
        # there and missing either is a silent distance error:
        #
        #   world_generator.py mounts a face of TAG_SIZE = 0.15 m, not 0.165;
        #   its texture carries a white quiet zone, so the black square is 0.800 of
        #   that face - checked on tags 1, 4, 7 and 9, identical on all four.
        #
        #   0.150 x 0.800 = 0.120 m
        #
        # Left at 0.165 the robot believes every tag is 1.37x further than it is: one
        # truly 0.50 m away reports 0.68 m, the approach pose lands a third of a metre
        # too far out, and the visit fails the 0.5 m rule while the detection itself
        # looks flawless.
        #
        # ON THE PHYSICAL ROBOT THIS IS STILL UNKNOWN. The guide's 16.5 cm may describe
        # the printed card rather than the black square, and the print need not match
        # the generator. Park at a tape-measured distance, run
        # solutions/test_assets/calibrate_tag_size.py, and take whatever it prints - it
        # goes through the real lens and the real print. Override without rebuilding:
        #   ros2 launch parc_solution apriltag_detection.launch.py tag_size:=0.165
        size: 0.12
        max_hamming: 0
        qos_profile: default

        detector:
            threads: 1
            # Default (2.0) halves the working resolution before quad detection.
            # Confirmed by direct test (test_assets/): our tag is already marginal at
            # ~12 px/module at a 2 m working distance: decimate=2.0 pushed detection to
            # zero. 1.0 costs more CPU per frame but is what actually finds the tag.
            decimate: 1.0
            blur: 0.0
            refine: True
            sharpening: 0.25
            debug: False

        pose_estimation_method: "pnp"
